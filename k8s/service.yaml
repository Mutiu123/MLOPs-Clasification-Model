apiVersion: v1
kind: Service
metadata:
  name: usvisa-app
  namespace: usvisa-app
  labels:
    app: usvisa-app
spec:
  type: ClusterIP
  selector:
    app: usvisa-app
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP

---
apiVersion: autoscaling.autoscaling.k8s.io/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usvisa-app-hpa
  namespace: usvisa-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usvisa-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usvisa-app-netpol
  namespace: usvisa-app
spec:
  podSelector:
    matchLabels:
      app: usvisa-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
