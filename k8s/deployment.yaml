apiVersion: v1
kind: Namespace
metadata:
  name: usvisa-app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: usvisa-config
  namespace: usvisa-app
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_PERIOD: "60"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
  AWS_DEFAULT_REGION: "eu-west-2"

---
apiVersion: v1
kind: Secret
metadata:
  name: usvisa-secrets
  namespace: usvisa-app
type: Opaque
stringData:
  MONGODB_URL: "mongodb+srv://username:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  SECRET_KEY: "your-secret-key-change-in-production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usvisa-app
  namespace: usvisa-app
  labels:
    app: usvisa-app
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: usvisa-app
  template:
    metadata:
      labels:
        app: usvisa-app
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: usvisa-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: usvisa-app
        image: your-registry/usvisa-app:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: usvisa-secrets
              key: MONGODB_URL
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: usvisa-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: usvisa-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: usvisa-secrets
              key: SECRET_KEY
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: usvisa-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: usvisa-config
              key: LOG_LEVEL
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: usvisa-config
              key: AWS_DEFAULT_REGION
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - usvisa-app
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usvisa-app
  namespace: usvisa-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: usvisa-app
  namespace: usvisa-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: usvisa-app
  namespace: usvisa-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: usvisa-app
subjects:
- kind: ServiceAccount
  name: usvisa-app
  namespace: usvisa-app
