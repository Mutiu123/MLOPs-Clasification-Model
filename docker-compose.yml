version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: usvisa-app
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=eu-west-2
      - ENVIRONMENT=development
      - DEBUG=True
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - mongo
      - prometheus
    networks:
      - usvisa-network
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8080 --reload

  # MongoDB
  mongo:
    image: mongo:6.0
    container_name: usvisa-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    networks:
      - usvisa-network
    healthcheck:
      test: ["CMD", "mongosh", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: usvisa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - usvisa-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: usvisa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - usvisa-network

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  usvisa-network:
    driver: bridge
